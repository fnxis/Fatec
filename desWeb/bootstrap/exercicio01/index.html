            </div>
            <div class="col-md-3 col-md-offset-0">

                    <label for="exampleInputEmail1">Bairro*</label>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script personalizado -->
  <script>
    // Seleciona os elementos do DOM
    const senhaInput = document.getElementById('senha');
    const toggleSenhaBtn = document.getElementById('toggleSenha');

    // Adiciona um evento de clique ao botão
    toggleSenhaBtn.addEventListener('click', function () {
      // Verifica o tipo atual do input
      if (senhaInput.type === 'password') {
        // Altera para texto e atualiza o texto do botão
        senhaInput.type = 'text';
         iconeSenha.classList.remove('bi-eye'); // Remove o ícone de olho aberto
        iconeSenha.classList.add('bi-eye-slash');
      } else {
        // Altera para senha e atualiza o texto do botão
        senhaInput.type = 'password';
        iconeSenha.classList.remove('bi-eye-slash'); // Remove o ícone de olho fechado
        iconeSenha.classList.add('bi-eye');
      }
    });
  </script>
</body>
